<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>92 Mistake Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            color: #f0f0f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s, visibility 1s;
        }

        .loading-logo {
            font-size: 4.5rem;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(45deg, #ff3366, #33ccff, #ffcc33, #33ff99);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: logoGlow 3s ease infinite, float 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .welcome-text {
            font-size: 2rem;
            margin-top: 2rem;
            opacity: 0;
            animation: fadeIn 2s forwards 2s;
        }

        .welcome-text span {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: letterDrop 0.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes letterDrop {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        header {
            background: rgba(10, 10, 42, 0.9);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #ff3366;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: #33ccff;
            text-shadow: 0 0 10px rgba(51, 204, 255, 0.7);
            transform-style: preserve-3d;
            animation: logoSpin 20s linear infinite;
        }

        @keyframes logoSpin {
            from { transform: rotateY(0); }
            to { transform: rotateY(360deg); }
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 0.5rem 1rem;
            width: 40%;
            border: 1px solid #33ccff;
            transition: all 0.3s;
        }

        .search-container:focus-within {
            box-shadow: 0 0 15px rgba(51, 204, 255, 0.5);
            transform: scale(1.05);
        }

        .search-bar {
            background: transparent;
            border: none;
            color: white;
            padding: 0.5rem;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Menu Buttons Container */
        .menu-buttons {
            display: flex;
            gap: 10px;
        }

        .menu-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .menu-btn:hover {
            background: #ff0044;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
        }

        /* Category buttons */
        .category-btn {
            background: linear-gradient(45deg, #33ccff, #33ff99);
            color: #0a0a2a;
        }

        .category-btn:hover {
            background: linear-gradient(45deg, #33ff99, #33ccff);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(51, 255, 153, 0.4);
        }

        /* Main Layout */
        .main-container {
            display: flex;
            padding: 2rem;
            gap: 2rem;
        }

        /* Left Sidebar */
        .sidebar {
            width: 25%;
            background: rgba(20, 20, 50, 0.8);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateY(-5deg);
            transition: transform 0.5s;
            border: 1px solid #33ff99;
        }

        .sidebar:hover {
            transform: perspective(1000px) rotateY(0);
        }

        .sidebar h2 {
            color: #ffcc33;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 2px solid #ffcc33;
            padding-bottom: 0.5rem;
        }

        .popular-books {
            list-style: none;
        }

        .book-item {
            background: rgba(30, 30, 70, 0.7);
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #ff3366;
            transform-style: preserve-3d;
            transform: translateZ(0);
        }

        .book-item:hover {
            background: rgba(40, 40, 90, 0.9);
            transform: translateZ(10px) translateX(10px);
            border-left: 4px solid #33ccff;
        }

        .book-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #f0f0f0;
        }

        .book-author {
            font-size: 0.9rem;
            color: #33ff99;
            margin-top: 0.3rem;
        }

        /* Main Content */
        .content {
            width: 75%;
        }

        .books-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .book-card {
            background: rgba(20, 20, 50, 0.8);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s;
            transform-style: preserve-3d;
            transform: perspective(500px) rotateY(0);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
        }

        .book-card:hover {
            transform: perspective(500px) rotateY(10deg) translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(51, 204, 255, 0.3);
            border: 1px solid #33ccff;
        }

        .book-cover {
            height: 250px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .book-info {
            padding: 1rem;
        }

        .book-name {
            font-weight: bold;
            font-size: 1.2rem;
            color: #f0f0f0;
            margin-bottom: 0.5rem;
        }

        .book-author-card {
            color: #33ff99;
            font-size: 0.9rem;
        }

        /* Category Menu */
        .category-menu {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: rgba(10, 10, 42, 0.95);
            padding: 2rem;
            z-index: 101;
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            overflow-y: auto;
            border-left: 3px solid #ffcc33;
            backdrop-filter: blur(10px);
        }

        .category-menu.active {
            right: 0;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .category-menu h2 {
            color: #ffcc33;
            font-size: 2rem;
        }

        .close-menu {
            background: none;
            border: none;
            color: #ff3366;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .close-menu:hover {
            transform: rotate(90deg);
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(30, 30, 70, 0.7);
            border-radius: 10px;
            border-left: 4px solid #33ff99;
            transform: translateX(20px);
            opacity: 0;
            transition: all 0.3s;
            animation: slideIn 0.5s forwards;
            cursor: pointer;
        }

        .category-item:hover {
            background: rgba(40, 40, 90, 0.9);
            transform: translateX(10px);
        }

        @keyframes slideIn {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Reader View - FULL SCREEN */
        .reader-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .reader-container {
            background: #0a0a2a;
            width: 100%;
            height: 100%;
            border-radius: 0;
            padding: 30px;
            overflow-y: auto;
            position: relative;
            border: none;
            box-shadow: none;
            animation: readerPop 0.5s forwards;
        }

        @keyframes readerPop {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #33ccff;
            padding-bottom: 1rem;
        }

        .reader-title {
            color: #ffcc33;
            font-size: 2.2rem;
        }

        .close-reader {
            position: fixed;
            top: 25px;
            right: 25px;
            background: #ff3366;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 1001;
            transition: all 0.3s;
        }

        .close-reader:hover {
            background: #ff0044;
            transform: rotate(90deg);
        }

        .reader-content {
            line-height: 1.9;
            font-size: 1.2rem;
            color: #f0f0f0;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(20, 20, 50, 0.5);
            border-radius: 10px;
        }

        /* Search Results */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 50, 0.95);
            border-radius: 0 0 15px 15px;
            z-index: 10;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid #33ccff;
        }

        .search-result-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-result-item:hover {
            background: rgba(51, 204, 255, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            
            .sidebar, .content {
                width: 100%;
            }
            
            .sidebar {
                transform: none;
            }
            
            .books-container {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            
            .search-container {
                width: 100%;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .menu-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .category-menu {
                width: 100%;
                right: -100%;
            }
        }

        /* Particle Effects */
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #33ccff;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .magic-text {
            text-shadow: 0 0 10px currentColor;
        }

        /* Category Filter Section */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(30, 30, 70, 0.8);
            color: #f0f0f0;
            border: 2px solid #33ccff;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .filter-btn:hover {
            background: #33ccff;
            color: #0a0a2a;
            transform: translateY(-3px);
        }

        .filter-btn.active {
            background: #ff3366;
            border-color: #ff3366;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">92 MISTAKE</div>
        <div class="welcome-text" id="welcomeText"></div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">92 MISTAKE</div>
        <div class="search-container">
            <i class="fas fa-search" style="color: #33ccff; margin-right: 10px;"></i>
            <input type="text" class="search-bar" id="searchBar" placeholder="Search books or authors...">
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="menu-buttons">
            <button class="menu-btn category-btn" id="categoryBtn">
                <i class="fas fa-book-open"></i> Categories
            </button>
            <button class="menu-btn" id="allBooksBtn">
                <i class="fas fa-books"></i> All Books
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container" id="mainContainer" style="display: none;">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <h2>Popular Books</h2>
            <ul class="popular-books" id="popularBooks">
                <!-- Popular books will be loaded here -->
            </ul>
        </div>

        <!-- Main Content -->
        <div class="content">
            <h1 style="color: #ffcc33; margin-bottom: 2rem; font-size: 2.5rem; text-align: center;">Magic Library</h1>
            
            <!-- Category Filter Buttons -->
            <div class="category-filter">
                <button class="filter-btn active" data-category="all">All Books</button>
                <button class="filter-btn" data-category="poems">ကဗျာများ</button>
                <button class="filter-btn" data-category="novels">ဝတ္ထုများ</button>
                <button class="filter-btn" data-category="dharma">တရားစာပေများ</button>
            </div>
            
            <div class="books-container" id="booksContainer">
                <!-- Book cards will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Category Menu -->
    <div class="category-menu" id="categoryMenu">
        <div class="category-header">
            <h2>Categories</h2>
            <button class="close-menu" id="closeMenu">&times;</button>
        </div>
        <ul class="category-list" id="categoryList">
            <li class="category-item" data-category="all">
                <h3 style="color: #33ccff;">All Books</h3>
                <p style="margin-top: 0.5rem; color: rgba(255,255,255,0.7);">View all books in the library</p>
            </li>
            <li class="category-item" data-category="poems">
                <h3 style="color: #33ff99;">ကဗျာများ</h3>
                <p style="margin-top: 0.5rem; color: rgba(255,255,255,0.7);">Beautiful poems and poetry collections</p>
            </li>
            <li class="category-item" data-category="novels">
                <h3 style="color: #ffcc33;">ဝတ္ထုများ</h3>
                <p style="margin-top: 0.5rem; color: rgba(255,255,255,0.7);">Novels and fiction stories</p>
            </li>
            <li class="category-item" data-category="dharma">
                <h3 style="color: #ff3366;">တရားစာပေများ</h3>
                <p style="margin-top: 0.5rem; color: rgba(255,255,255,0.7);">Dharma books and spiritual teachings</p>
            </li>
        </ul>
    </div>

    <!-- Reader View - FULL SCREEN -->
    <div class="reader-view" id="readerView">
        <div class="reader-container">
            <div class="reader-header">
                <h2 class="reader-title" id="readerTitle">Book Title</h2>
            </div>
            <div class="reader-content" id="readerContent">
                <!-- Book content will be loaded here -->
            </div>
            <button class="close-reader" id="closeReader">&times;</button>
        </div>
    </div>

    <script>
        // =============================================
        // ADMIN အနေနဲ့ ဒီနေရာကို ပြင်ရမည့် DATA
        // =============================================

        const libraryData = {
            books: [
                // =============================================
                // ကဗျာများ (Poems) - ဒီနေရာမှာ ထည့်ပါ
                // =============================================
                {
                    id: 1,
                    title: "စိတ်ကူးယဉ်ကဗျာများ",
                    author: "စိတ်ကူးစာဆို",
                    category: "poems", // ဒီစာအုပ်က ဘယ်အမျိုးအစားလဲ
                    cover: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                    content: `ကဗျာ အမှတ် ၁\n\nမိုးစက်တွေကျလာတဲ့အခါ\nစိတ်ကူးတွေပျံ့လွင့်သွားတယ်\nဘဝရဲ့အရောင်တွေ\nစာရွက်ပေါ်မှာပုံဖော်မိတယ်။\n\nကဗျာ အမှတ် ၂\n\n နေခင်းနေဝင်ချိန်\nအတိတ်မှတ်တမ်းတွေ\nမျက်နှာကျက်မှာရုပ်ရှင်ပြ\nအသက်ရှူသံတွေနဲ့အတူ။`
                },
                {
                    id: 2,
                    title: "ရင်ဘတ်ထဲကစကားသံ",
                    author: "နှလုံးသားကဗျာဆို",
                    category: "poems",
                    cover: "https://images.unsplash.com/photo-1532012197267-da84d127e765?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                    content: `နှလုံးသားထဲက အသံ\n\nကြားရတဲ့အသံတွေထဲ\nသင့်စကားသံက\nအမြဲတမ်းကြားနေရ\nအိပ်မက်ထဲအထိပါ။\n\nချစ်ခြင်းမေတ္တာ\n\nချစ်တယ်ဆိုတာ\nမိုးရွာတဲ့အခါ\nထီးတစ်စီးနဲ့\nလမ်းအတူလျှောက်တာ။`
                },
                
                // =============================================
                // ဝတ္ထုများ (Novels) - ဒီနေရာမှာ ထည့်ပါ
                // =============================================
                {
                    id: 3,
                    title: "အပျိုဖြူကလေး",
                    author: "ဝတ္ထုရေးဆရာ",
                    category: "novels",
                    cover: "https://images.unsplash.com/photo-1621351183012-e2f9972dd9bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                    content: `အခန်း (၁)\n\nရွာလေးရဲ့အစွန်းမှာ\nသစ်ပင်ကြီးတစ်ပင်အောက်\nအိမ်လေးတစ်လုံးရှိတယ်။\nအဲ့အိမ်မှာ အပျိုဖြူကလေးတစ်ယောက်\nအဖေအမေနဲ့အတူနေထိုင်တယ်။\n\nသူမရဲ့ဘဝဟာ\nရွာလေးရဲ့သဘာဝလိုပဲ\nအေးချမ်းပြီးရိုးရှင်းတယ်။\nနေ့စဉ်လှိုင်းတွေလို\nဘဝဟာလည်းတိုးတိုးတက်တက်။`
                },
                {
                    id: 4,
                    title: "မြစ်ကြီးနားမှာရှိတဲ့အိမ်",
                    author: "စွန့်စားခန်းစာရေးဆရာ",
                    category: "novels",
                    cover: "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                    content: `ပထမပိုင်း\n\nမြစ်ကြီးနားဆိုတာ\nကမ္ဘာ့အလယ်မှာရှိတဲ့\nလျှို့ဝှက်ဆန်းကြယ်တဲ့နေရာ။\nအဲ့ဒီမှာရှိတဲ့အိမ်ကြီးဟာ\nနှစ်ပေါင်းတစ်ရာကျော်သက်တမ်းရှိပြီ။\n\nဒုတိယပိုင်း\n\nအိမ်ကြီးထဲဝင်တဲ့အခါ\nသမိုင်းတွေကြားရတယ်။\nအတိတ်ရဲ့အရိပ်တွေက\nနံရံတိုင်းမှာရှိနေတယ်။\nလျှို့ဝှက်ချက်တွေက\nအခန်းတိုင်းမှာပုန်းကွယ်နေတယ်။`
                },
                
                // =============================================
                // တရားစာပေများ (Dharma) - ဒီနေရာမှာ ထည့်ပါ
                // =============================================
                {
                    id: 5,
                    title: "မေတ္တာသုတ်နှင့်အဓိပ္ပာယ်",
                    author: "ဘုန်းကြီးပညာရှိ",
                    category: "dharma",
                    cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                    content: `မေတ္တာသုတ်\n\nသဗ္ဗေသတ္တာ သုခီတထာ\nသဗ္ဗေသတ္တာ အဝေရာ ဟောန္တု\nသဗ္ဗေသတ္တာ အဝေရာ သုခီတထာ။\n\nအဓိပ္ပာယ်\n\nသတ္တဝါအားလုံးသည် ချမ်းသာကြပါစေ\nသတ္တဝါအားလုံး အပြစ်ကင်းကြပါစေ\nသတ္တဝါအားလုံး ဘေးရန်မှလွတ်ကြပါစေ။\n\nသတိပဋ္ဌာန်\n\nကိုယ်၌ကိုယ်ကိုသတိ\nဝေဒနာ၌ဝေဒနာကိုသတိ\nစိတ်၌စိတ်ကိုသတိ\nသဘောတရား၌သဘောတရားကိုသတိ။`
                },
                {
                    id: 6,
                    title: "ဗုဒ္ဓအဆုံးအမများ",
                    author: "ဓမ္မပညာရှင်",
                    category: "dharma",
                    cover: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                    content: `ဗုဒ္ဓ၏နောက်ဆုံးစကား\n\n ံယောဇဉ်ကိုဖြတ်ကြ\nအပြစ်မှဝေးကြ\nအားထုတ်ကြိုးစားကြ\nသတိရှိကြ။\n\nအရေးကြီးသောအဆုံးအမ (၅) ချက်\n\n၁။ ကောင်းမှုပြုကြ\n၂။ ကိုယ်နှုတ်စိတ်သုံးပါးကိုစောင့်ရှောက်ကြ\n၃။ မိဘကိုရိုသေကြ\n၄။ ဆရာသမားကိုလေးစားကြ\n၅။ သူတစ်ပါးကိုကူညီကြ။\n\nသစ္စာလေးပါး\n\n၁။ ဒုက္ခသစ္စာ - ဆင်းရဲခြင်းအမှန်\n၂။ သမုဒယသစ္စာ - ဆင်းရဲဖြစ်ကြောင်းအမှန်\n၃။ နိရောဓသစ္စာ - ဆင်းရဲချုပ်ရာအမှန်\n၄။ မဂ္ဂသစ္စာ - ဆင်းရဲချုပ်ရာသို့ရောက်ကြောင်းအမှန်။`
                }
            ],
            
            // =============================================
            // Popular Books - ဒီနေရာမှာ ထည့်ပါ
            // =============================================
            popularBooks: [1, 3, 5, 2] // ဒီကိန်းဂဏန်းတွေက books array ထဲက id တွေပါ
        };

        // =============================================
        // DOM Elements
        // =============================================
        const loadingScreen = document.getElementById('loadingScreen');
        const welcomeText = document.getElementById('welcomeText');
        const mainContainer = document.getElementById('mainContainer');
        const booksContainer = document.getElementById('booksContainer');
        const popularBooksList = document.getElementById('popularBooks');
        const searchBar = document.getElementById('searchBar');
        const searchResults = document.getElementById('searchResults');
        const categoryBtn = document.getElementById('categoryBtn');
        const allBooksBtn = document.getElementById('allBooksBtn');
        const categoryMenu = document.getElementById('categoryMenu');
        const closeMenu = document.getElementById('closeMenu');
        const categoryList = document.getElementById('categoryList');
        const readerView = document.getElementById('readerView');
        const readerTitle = document.getElementById('readerTitle');
        const readerContent = document.getElementById('readerContent');
        const closeReader = document.getElementById('closeReader');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const categoryItems = document.querySelectorAll('.category-item');

        // Current category filter
        let currentCategory = 'all';

        // =============================================
        // Initialize the page
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Welcome text animation
            const text = "Welcome to 92 Mistake Library";
            for(let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                span.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                span.style.animationDelay = `${2.5 + i * 0.1}s`;
                welcomeText.appendChild(span);
            }

            // After 5 seconds, hide loading screen and show main content
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.visibility = 'hidden';
                mainContainer.style.display = 'flex';
                
                // Initialize books and categories
                renderBooks();
                renderPopularBooks();
                
                // Add some magic particles
                createParticles();
            }, 5000);
        });

        // =============================================
        // Render books based on category
        // =============================================
        function renderBooks() {
            booksContainer.innerHTML = '';
            
            let filteredBooks = libraryData.books;
            
            if (currentCategory !== 'all') {
                filteredBooks = libraryData.books.filter(book => book.category === currentCategory);
            }
            
            if (filteredBooks.length === 0) {
                booksContainer.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                        <h3 style="color: #ffcc33; margin-bottom: 20px;">No books found in this category</h3>
                        <p style="color: #33ccff;">Try another category or check back later!</p>
                    </div>
                `;
                return;
            }
            
            filteredBooks.forEach(book => {
                const bookCard = document.createElement('div');
                bookCard.className = 'book-card';
                bookCard.innerHTML = `
                    <div class="book-cover" style="background-image: url('${book.cover}')"></div>
                    <div class="book-info">
                        <div class="book-name magic-text">${book.title}</div>
                        <div class="book-author-card">by ${book.author}</div>
                        <div style="font-size: 0.8rem; color: #ffcc33; margin-top: 0.5rem;">
                            ${getCategoryName(book.category)}
                        </div>
                    </div>
                `;
                
                bookCard.addEventListener('click', () => openReader(book));
                booksContainer.appendChild(bookCard);
                
                // Add animation on load
                setTimeout(() => {
                    bookCard.style.opacity = '1';
                }, 100);
            });
        }

        // =============================================
        // Get category name in Burmese
        // =============================================
        function getCategoryName(category) {
            switch(category) {
                case 'poems': return 'ကဗျာများ';
                case 'novels': return 'ဝတ္ထုများ';
                case 'dharma': return 'တရားစာပေများ';
                default: return '';
            }
        }

        // =============================================
        // Render popular books in sidebar
        // =============================================
        function renderPopularBooks() {
            popularBooksList.innerHTML = '';
            
            libraryData.popularBooks.forEach(bookId => {
                const book = libraryData.books.find(b => b.id === bookId);
                if (book) {
                    const bookItem = document.createElement('li');
                    bookItem.className = 'book-item';
                    bookItem.innerHTML = `
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">by ${book.author}</div>
                        <div style="font-size: 0.8rem; color: #ffcc33; margin-top: 0.3rem;">
                            ${getCategoryName(book.category)}
                        </div>
                    `;
                    
                    bookItem.addEventListener('click', () => openReader(book));
                    popularBooksList.appendChild(bookItem);
                    
                    // Staggered animation
                    setTimeout(() => {
                        bookItem.style.opacity = '1';
                    }, 100);
                }
            });
        }

        // =============================================
        // Open reader with book content - FULL SCREEN
        // =============================================
        function openReader(book) {
            readerTitle.textContent = book.title;
            readerContent.textContent = book.content;
            readerView.style.display = 'flex';
            
            // Prevent scrolling on body when reader is open
            document.body.style.overflow = 'hidden';
            
            // Add animation
            readerView.style.opacity = '0';
            setTimeout(() => {
                readerView.style.opacity = '1';
            }, 10);
        }

        // =============================================
        // Search functionality
        // =============================================
        searchBar.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            searchResults.innerHTML = '';
            
            if (searchTerm.length === 0) {
                searchResults.style.display = 'none';
                return;
            }
            
            // Search in books
            const results = [];
            
            libraryData.books.forEach(book => {
                if (book.title.toLowerCase().includes(searchTerm) || 
                    book.author.toLowerCase().includes(searchTerm) ||
                    getCategoryName(book.category).toLowerCase().includes(searchTerm)) {
                    results.push({
                        title: book.title,
                        author: book.author,
                        category: book.category,
                        book: book
                    });
                }
            });
            
            // Display results
            if (results.length > 0) {
                results.slice(0, 5).forEach(result => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'search-result-item';
                    resultItem.innerHTML = `
                        <div style="font-weight: bold;">${result.title}</div>
                        <div style="font-size: 0.9rem; color: #33ff99;">by ${result.author}</div>
                        <div style="font-size: 0.8rem; color: #ffcc33;">${getCategoryName(result.category)}</div>
                    `;
                    
                    resultItem.addEventListener('click', () => {
                        openReader(result.book);
                        searchResults.style.display = 'none';
                        searchBar.value = '';
                    });
                    
                    searchResults.appendChild(resultItem);
                });
                
                searchResults.style.display = 'block';
            } else {
                const noResult = document.createElement('div');
                noResult.className = 'search-result-item';
                noResult.textContent = 'No results found';
                searchResults.appendChild(noResult);
                searchResults.style.display = 'block';
            }
        });

        // =============================================
        // Category filter buttons
        // =============================================
        filterButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remove active class from all buttons
                filterButtons.forEach(btn => btn.classList.remove('active'));
                
                // Add active class to clicked button
                this.classList.add('active');
                
                // Set current category
                currentCategory = this.getAttribute('data-category');
                
                // Render books for this category
                renderBooks();
            });
        });

        // =============================================
        // Category menu items
        // =============================================
        categoryItems.forEach(item => {
            item.addEventListener('click', function() {
                const category = this.getAttribute('data-category');
                
                // Close menu
                categoryMenu.classList.remove('active');
                
                // Set active filter button
                filterButtons.forEach(btn => btn.classList.remove('active'));
                filterButtons.forEach(btn => {
                    if (btn.getAttribute('data-category') === category) {
                        btn.classList.add('active');
                    }
                });
                
                // Set current category
                currentCategory = category;
                
                // Render books for this category
                renderBooks();
            });
        });

        // =============================================
        // Close search results when clicking outside
        // =============================================
        document.addEventListener('click', function(e) {
            if (!searchBar.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.style.display = 'none';
            }
        });

        // =============================================
        // Category menu toggle
        // =============================================
        categoryBtn.addEventListener('click', () => {
            categoryMenu.classList.add('active');
        });

        closeMenu.addEventListener('click', () => {
            categoryMenu.classList.remove('active');
        });

        // =============================================
        // All books button
        // =============================================
        allBooksBtn.addEventListener('click', () => {
            currentCategory = 'all';
            
            // Set active filter button
            filterButtons.forEach(btn => btn.classList.remove('active'));
            filterButtons.forEach(btn => {
                if (btn.getAttribute('data-category') === 'all') {
                    btn.classList.add('active');
                }
            });
            
            // Render all books
            renderBooks();
        });

        // =============================================
        // Close reader
        // =============================================
        closeReader.addEventListener('click', () => {
            readerView.style.opacity = '0';
            setTimeout(() => {
                readerView.style.display = 'none';
                document.body.style.overflow = 'auto'; // Restore scrolling
            }, 300);
        });

        // =============================================
        // Close reader with Escape key
        // =============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && readerView.style.display === 'flex') {
                closeReader.click();
            }
        });

        // =============================================
        // Create magical particles
        // =============================================
        function createParticles() {
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random position
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                particle.style.left = `${posX}vw`;
                particle.style.top = `${posY}vh`;
                
                // Random size
                const size = Math.random() * 4 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random color
                const colors = ['#33ccff', '#ff3366', '#ffcc33', '#33ff99'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                
                // Random animation
                const duration = Math.random() * 10 + 10;
                particle.style.animation = `float ${duration}s ease-in-out infinite`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                document.body.appendChild(particle);
            }
        }

        // =============================================
        // Add 3D effect to book cards on mouse move
        // =============================================
        document.addEventListener('mousemove', function(e) {
            const cards = document.querySelectorAll('.book-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const isHovered = e.clientX >= rect.left && e.clientX <= rect.right && 
                                 e.clientY >= rect.top && e.clientY <= rect.bottom;
                
                if (!isHovered) {
                    card.style.transform = `perspective(500px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                }
            });
        });
    </script>
</body>
</html>
